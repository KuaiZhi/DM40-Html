<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DM40 Web Bluetooth</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app-shell">
    <header class="topbar">
      <div>
        <p class="eyebrow">DM40 WEB HOST</p>
        <h1>DM40 Bluetooth Console</h1>
      </div>
      <span id="connectionState" class="status" data-state="offline">未连接</span>
    </header>

    <section class="toolbar" aria-label="设备连接">
      <button id="scanButton">扫描设备</button>
      <button id="disconnectButton" disabled>断开</button>
    </section>

    <section class="panel reading-panel">
      <div class="panel-heading">
        <h2>设备信息: <span id="deviceName">--</span></h2>
        <span id="batteryStatus">电量 --</span>
      </div>
    </section>

    <section class="panel measurement-panel">
      <div class="panel-heading">
        <h2>测量值</h2>
        <span id="rangeValue">--</span>
      </div>
      <div class="measurement-reading">
        <strong id="readingValue">---</strong>
        <span id="statusValue">--</span>
      </div>
    </section>

    <section class="mode-controls" aria-label="测量模式">
      <button class="mode-button" data-mode-group="V" disabled>直流电压</button>
      <button class="mode-button" data-mode-group="A" disabled>直流电流</button>
      <button class="mode-button" data-mode-group="R" disabled>电阻</button>
      <button class="mode-button" data-mode-group="C" disabled>电容</button>
      <button class="mode-button" data-mode-group="D" disabled>二极管</button>
      <button class="mode-button" data-mode-group="F" disabled>频率</button>
    </section>

    <section class="panel">
      <div class="panel-heading">
        <h2>原始数据</h2>
        <button id="clearButton" class="small-button">清空</button>
      </div>
      <pre id="rawLog" class="raw-log" aria-live="polite">等待连接设备...</pre>
    </section>

    <p id="message" class="message" role="status">页面脚本加载中...</p>
  </main>
  <script defer src="protocol/constants.js"></script>
  <script defer src="protocol/parser.js"></script>
  <script defer src="app.js"></script>
</body>
</html>
